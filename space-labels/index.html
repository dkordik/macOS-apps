<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space Labels</title>
<meta name="description" content="Give names to your macOS Spaces.">
<link rel="icon" href="icon.png">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --accent: #0071e3;
    --accent-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101b2e;
      --text: #f5f5f7;
      --muted: #a1a1a6;
      --accent: #2997ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 17px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
  nav { margin-bottom: 48px; font-size: 15px; font-weight: 600; text-align: center; }
  nav a { color: var(--muted); text-decoration: none; }
  nav a:hover { color: var(--text); }
  header { text-align: center; }
  header img { width: 128px; height: 128px; }
  h1 { font-size: 44px; line-height: 1.1; letter-spacing: -0.02em; margin: 16px 0 8px; }
  .tagline { font-size: 21px; color: var(--muted); margin: 0 auto 32px; max-width: 32em; }
  .download {
    display: inline-block;
    background: var(--accent);
    color: var(--accent-text);
    text-decoration: none;
    font-weight: 600;
    padding: 12px 28px;
    border-radius: 980px;
  }
  .download:hover { filter: brightness(1.08); }
  .requirements { color: var(--muted); font-size: 14px; margin-top: 12px; }
</style>
</head>
<body>
<main>
  <nav><a href="../">/dkordik/macOS-apps</a></nav>
  <header>
    <img src="icon.png" alt="">
    <h1>Space Labels</h1>
    <p class="tagline">Give names to your macOS Spaces</p>
    <!-- The app's scripts/release.sh rewrites the href and build line on each release. -->
    <a class="download" id="download" href="https://github.com/dkordik/macOS-apps/releases">Download for Mac</a>
    <p class="requirements">Free · Requires macOS 14 or later<span id="build"></span></p>
  </header>

</main>
</body>
</html>
