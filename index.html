<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dkordik/macOS-apps</title>
<meta name="description" content="Small, free macOS apps by Dan Kordik.">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --card: #ffffff;
    --border: rgba(0, 0, 0, 0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101b2e;
      --text: #f5f5f7;
      --muted: #a1a1a6;
      --card: #1a2740;
      --border: rgba(255, 255, 255, 0.10);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 17px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 720px; margin: 0 auto; padding: 72px 16px 48px; }
  h1 { font-size: 40px; letter-spacing: -0.02em; margin: 0 0 32px; }
  .apps { display: grid; gap: 12px; }
  .app {
    display: flex; gap: 16px; align-items: center;
    padding: 16px; border-radius: 14px;
    background: var(--card); border: 1px solid var(--border);
    color: inherit; text-decoration: none;
  }
  .app:hover { border-color: var(--muted); }
  .app img { width: 64px; height: 64px; flex: none; }
  .app h2 { font-size: 19px; margin: 0 0 2px; }
  .app p { margin: 0; color: var(--muted); font-size: 15px; }
</style>
</head>
<body>
<main>
  <h1>/dkordik/macOS-apps</h1>
  <div class="apps">
    <a class="app" href="space-labels/">
      <img src="space-labels/icon.png" alt="">
      <div>
        <h2>Space Labels</h2>
        <p>Give names to your macOS Spaces</p>
      </div>
    </a>
  </div>
</main>
</body>
</html>
